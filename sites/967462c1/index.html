<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>苏州文旅局</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <header class="bg-blue-800 text-white p-6">
        <h1 class="text-4xl font-bold text-center">欢迎来到苏州文旅局</h1>
    </header>
    
    <main class="container mx-auto my-10 p-6 bg-white rounded-lg shadow-lg">
        <section id="introduction" class="mb-10">
            <h2 class="text-3xl font-semibold mb-4">关于我们</h2>
            <p>苏州文旅局致力于推动苏州文化和旅游的发展，为游客提供丰富的文化体验和旅游服务。</p>
        </section>

        <section id="attractions" class="mb-10">
            <h2 class="text-3xl font-semibold mb-4">推荐景点</h2>
            <ul class="list-disc list-inside">
                <li class="mb-2">拙政园</li>
                <li class="mb-2">苏州博物馆</li>
                <li class="mb-2">虎丘</li>
                <li class="mb-2">平江路</li>
                <li class="mb-2">周庄古镇</li>
            </ul>
        </section>

        <section id="contact">
            <h2 class="text-3xl font-semibold mb-4">联系我们</h2>
            <p>电话: 123-456-7890</p>
            <p>邮箱: info@suzhou.gov.cn</p>
        </section>
    </main>

    <footer class="bg-blue-800 text-white text-center p-4">
        <p>© 2023 苏州文旅局. 保留所有权利.</p>
    </footer>
</body>
</html>
